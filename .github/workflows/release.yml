name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------- Linux: 4 platforms, all on fast x86 runner ----------
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            arch: x86_64
            cross: ""
          - name: linux-aarch64
            arch: aarch64
            cross: aarch64-linux-gnu
          - name: linux-riscv64
            arch: riscv64
            cross: riscv64-linux-gnu
          - name: linux-armhf
            arch: arm
            cross: arm-linux-gnueabihf
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        if: matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross }}-gcc ${{ matrix.cross }}-g++
      - name: Configure
        run: |
          if [ -n "${{ matrix.cross }}" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=${{ matrix.cross }}-gcc \
              -DCMAKE_CXX_COMPILER=${{ matrix.cross }}-g++ \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Package
        run: |
          mkdir -p out
          cp build/src/neolith out/neolith-${{ matrix.name }}
          chmod +x out/neolith-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: neolith-${{ matrix.name }}
          path: out/neolith-${{ matrix.name }}

  # ---------- Windows x86_64 ----------
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel
      - name: Package
        shell: cmd
        run: |
          mkdir out
          for /r build %%f in (neolith.exe) do copy /y "%%f" out\neolith-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: neolith-windows-x86_64
          path: out/neolith-windows-x86_64.exe

  # ---------- macOS Apple Silicon ----------
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Package
        run: |
          mkdir -p out
          cp build/src/neolith out/neolith-macos-aarch64
          chmod +x out/neolith-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: neolith-macos-aarch64
          path: out/neolith-macos-aarch64

  # ---------- Create GitHub Release (tolerant of partial failures) ----------
  release:
    needs: [linux, windows, macos]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: neolith-*
          merge-multiple: true
          path: bins
      - name: List binaries
        run: |
          ls -la bins/
          chmod +x bins/* 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bins/*
          generate_release_notes: true
          draft: false
